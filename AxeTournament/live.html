<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVURAXE · Live</title>
  <link rel="icon" href="public/dataxe-simple.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg:      #0d0d0f;
      --bg2:     #111114;
      --bg3:     #18181c;
      --border:  rgba(255,255,255,0.07);
      --amber:   #c4873a;
      --amber2:  #e8a84e;
      --ink:     #f0ece6;
      --ink3:    rgba(240,236,230,0.55);
      --ink4:    rgba(240,236,230,0.3);
      --green:   #4cd98a;
      --red:     #e05555;
      --r:       10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── SCANLINE TEXTURE ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
    }

    /* ── NAV (igual que index.html) ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 2.5rem;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s;
    }
    nav.scrolled {
      background: rgba(13,13,15,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(196,135,58,0.15);
    }
    .t-logo { display: inline-flex; align-items: center; justify-content: center; }
    .logo-img {
      height: 56px; width: auto; object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(196,135,58,0.2));
    }
    .nav-links {
      display: flex; align-items: center; gap: 0.25rem; list-style: none;
    }
    .nav-links a {
      font-family: 'DM Mono', monospace;
      font-size: 11px; font-weight: 500; letter-spacing: 1.5px;
      text-transform: uppercase; color: rgba(240,236,230,0.5);
      text-decoration: none; padding: 6px 14px; border-radius: 4px;
      transition: all 0.2s;
    }
    .nav-links a:hover { color: #f0ece6; background: rgba(255,255,255,0.06); }
    .nav-cta {
      background: var(--amber) !important; color: #0d0d0f !important;
      font-weight: 500 !important; padding: 8px 20px !important;
    }
    .nav-cta:hover { background: #e8a84e !important; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(196,135,58,0.35); }
    .nav-mobile-btn {
      display: none; background: none; border: none;
      color: #f0ece6; font-size: 22px; cursor: pointer;
    }
    /* LIVE badge integrado en nav */
    .live-badge {
      display: flex; align-items: center; gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 10px; font-weight: 500; letter-spacing: 2px;
      text-transform: uppercase; color: var(--green);
      border: 1px solid rgba(76,217,138,0.25);
      padding: 5px 12px; border-radius: 20px;
      background: rgba(76,217,138,0.07);
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 1.4s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.7); }
    }
    .last-updated {
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: rgba(240,236,230,0.25);
    }
    /* Mobile menu (igual que index) */
    .mobile-menu {
      display: none; position: fixed; inset: 0;
      background: rgba(13,13,15,0.97); z-index: 99;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 2rem; backdrop-filter: blur(20px);
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem;
      letter-spacing: 2px; color: #f0ece6; text-decoration: none; transition: color 0.2s;
    }
    .mobile-menu a:hover { color: var(--amber); }
    .mobile-menu-close {
      position: absolute; top: 1.5rem; right: 1.5rem;
      background: none; border: none; color: rgba(240,236,230,0.3);
      font-size: 1.5rem; cursor: pointer; font-family: 'DM Mono', monospace;
    }
    @media (max-width: 900px) {
      nav { padding: 0 1.5rem; }
      .nav-links { display: none; }
      .nav-mobile-btn { display: block; }
    }

    /* ── LAYOUT ── */
    .wrap {
      max-width: 1100px; margin: 0 auto;
      padding: 7rem 1.5rem 6rem;
      position: relative; z-index: 1;
    }

    /* ── EMPTY / LOADING STATES ── */
    .state-center {
      text-align: center; padding: 8rem 2rem;
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
    }
    .state-icon { font-size: 3rem; opacity: 0.25; }
    .state-title { font-family: 'Bebas Neue',sans-serif; font-size: 2rem; letter-spacing: 2px; color: var(--ink3); }
    .state-sub { font-size: 13px; color: var(--ink4); }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid rgba(196,135,58,0.15);
      border-top-color: var(--amber);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ACCORDION LIST ── */
    .tournament-list {
      display: flex; flex-direction: column; gap: 0;
    }

    /* Banner / header row */
    .t-banner {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.1rem 1.5rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      cursor: pointer;
      transition: all 0.2s;
      position: relative; z-index: 1;
      margin-bottom: 2px;
      user-select: none;
    }
    .t-banner:hover {
      border-color: rgba(196,135,58,0.3);
      background: rgba(196,135,58,0.04);
    }
    .t-banner.open {
      border-color: rgba(196,135,58,0.4);
      background: rgba(196,135,58,0.06);
      border-radius: var(--r) var(--r) 0 0;
      margin-bottom: 0;
    }
    .t-banner-logo {
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      overflow: hidden; background: rgba(196,135,58,0.1);
      border: 1px solid rgba(196,135,58,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .t-banner-logo img { width: 100%; height: 100%; object-fit: cover; }
    .t-banner-info { flex: 1; min-width: 0; }
    .t-banner-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-banner-meta { font-size: 11px; color: var(--ink4); margin-top: 2px; }
    .t-banner-champ { font-size: 11px; color: var(--amber); margin-top: 3px; font-weight: 600; }
    .t-banner-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .org-live-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 3px 10px; border-radius: 20px;
      background: rgba(76,217,138,0.1); color: var(--green);
      border: 1px solid rgba(76,217,138,0.2);
      display: flex; align-items: center; gap: 5px;
    }
    .org-done-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 3px 10px; border-radius: 20px;
      background: rgba(255,255,255,0.04); color: var(--ink4);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .org-closed-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 3px 10px; border-radius: 20px;
      background: rgba(212,99,90,0.12); color: #e05555;
      border: 1px solid rgba(212,99,90,0.35);
    }
    .t-banner-chevron {
      font-size: 11px; color: var(--ink4);
      transition: transform 0.25s; flex-shrink: 0;
    }
    .t-banner.open .t-banner-chevron { transform: rotate(180deg); }

    /* Expandable panel */
    .t-panel {
      max-height: 0; overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
      background: var(--bg);
      border: 1px solid rgba(196,135,58,0.25);
      border-top: none;
      border-radius: 0 0 var(--r) var(--r);
      margin-bottom: 12px;
    }
    .t-panel.open {
      max-height: 4000px;
    }
    .t-panel-inner {
      padding: 1.5rem;
    }

    /* Section labels */
    .list-section-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: var(--ink4);
      margin-bottom: 0.75rem; margin-top: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .list-section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .org-champ { font-size: 11px; color: var(--amber); margin-top: 3px; font-weight: 600; }

    /* ── SECTION HEADER ── */
    .section-hdr {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem; padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .section-eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: var(--amber);
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem; letter-spacing: 2px; line-height: 1;
    }
    .back-btn {
      font-size: 12px; color: var(--ink4);
      background: none; border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 14px; cursor: pointer;
      font-family: inherit; transition: all 0.15s; margin-left: auto;
    }
    .back-btn:hover { color: var(--ink); border-color: rgba(255,255,255,0.2); }

    /* ── TABS ── */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 1.75rem;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 4px;
      width: fit-content;
    }
    .tab-btn {
      font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
      padding: 8px 18px; border-radius: 7px; border: none;
      background: none; color: var(--ink4); cursor: pointer;
      font-family: inherit; transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.on {
      background: rgba(196,135,58,0.15);
      color: var(--amber);
    }

    /* ── TOURNAMENT INFO CARD ── */
    .t-info-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.5rem;
      margin-bottom: 1.75rem;
      display: flex; align-items: center; gap: 1.5rem;
      flex-wrap: wrap;
    }
    .t-info-logo {
      width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
      overflow: hidden; background: rgba(196,135,58,0.1);
      border: 2px solid rgba(196,135,58,0.3);
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .t-info-logo img { width: 100%; height: 100%; object-fit: cover; }
    .t-info-name { font-family: 'Bebas Neue',sans-serif; font-size: 1.6rem; letter-spacing: 2px; }
    .t-info-meta { font-size: 12px; color: var(--ink4); margin-top: 3px; }
    .t-info-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .pill {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; padding: 4px 12px; border-radius: 20px;
    }
    .pill-phase-qualify { background: rgba(99,179,237,0.1); color: #63b3ed; border: 1px solid rgba(99,179,237,0.2); }
    .pill-phase-elim    { background: rgba(196,135,58,0.1); color: var(--amber); border: 1px solid rgba(196,135,58,0.2); }
    .pill-phase-done    { background: rgba(76,217,138,0.1); color: var(--green); border: 1px solid rgba(76,217,138,0.2); }
    .pill-pro  { background: rgba(196,135,58,0.12); color: var(--amber); border: 1px solid rgba(196,135,58,0.25); }
    .pill-semi { background: rgba(99,179,237,0.1);  color: #63b3ed;     border: 1px solid rgba(99,179,237,0.25); }

    /* ── QUALIFY TABLE ── */
    .qual-table-wrap { overflow-x: auto; border-radius: var(--r); border: 1px solid var(--border); }
    table.qual-table {
      width: 100%; border-collapse: collapse;
      font-size: 13px; min-width: 400px;
    }
    .qual-table thead tr { background: var(--bg2); }
    .qual-table th {
      padding: 10px 14px; text-align: left;
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--ink4);
      border-bottom: 1px solid var(--border);
    }
    .qual-table th.center, .qual-table td.center { text-align: center; }
    .qual-table td { padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .qual-table tr:last-child td { border-bottom: none; }
    .qual-table tr { background: var(--bg); transition: background 0.15s; }
    .qual-table tr:hover { background: rgba(255,255,255,0.02); }
    .rank-num {
      font-family: 'DM Mono', monospace; font-size: 11px;
      color: var(--ink4); font-weight: 500;
    }
    .rank-1 { color: #d4af37; }
    .rank-2 { color: #a8a8b8; }
    .rank-3 { color: #b06432; }
    .player-name { font-weight: 700; font-size: 14px; }
    .player-name.dq { opacity: 0.35; text-decoration: line-through; }
    .score-pts {
      font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500;
      color: var(--amber);
    }
    .score-ks {
      font-size: 10px; color: var(--ink4); margin-top: 1px;
    }
    .throws-mini {
      display: flex; gap: 3px; flex-wrap: wrap;
    }
    .t-cell {
      width: 20px; height: 20px; border-radius: 4px;
      font-size: 9px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.04);
      color: var(--ink4);
    }
    .t-cell.scored { background: rgba(196,135,58,0.12); color: var(--amber); }
    .t-cell.is-ks  { background: rgba(76,217,138,0.15); color: var(--green); font-size: 8px; }
    .t-cell.is-zero { background: rgba(224,85,85,0.1); color: var(--red); }

    /* ── BRACKET ── */
    .bracket-scroll { overflow-x: auto; padding-bottom: 1rem; }
    .bracket-wrap {
      display: flex; gap: 0; align-items: flex-start;
      min-width: max-content; padding: 1rem;
    }
    .b-round { display: flex; flex-direction: column; }
    .b-round-hdr {
      font-family: 'DM Mono', monospace;
      font-size: 9px; font-weight: 500; letter-spacing: 2px;
      text-transform: uppercase; color: var(--ink4);
      text-align: center; padding: 0 0 1rem; min-width: 180px;
    }
    .b-matches { display: flex; flex-direction: column; gap: 0; align-items: center; }
    .b-match-wrap {
      display: flex; align-items: center;
      margin-bottom: 0;
    }
    .b-match {
      width: 170px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
      margin: 8px 0;
    }
    .b-match.final {
      border-color: rgba(196,135,58,0.35);
      box-shadow: 0 0 20px rgba(196,135,58,0.08);
    }
    .b-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; gap: 8px;
      font-size: 13px; font-weight: 600;
      transition: background 0.15s;
    }
    .b-row.b-winner {
      background: rgba(76,217,138,0.08);
      color: var(--green);
    }
    .b-row.b-loser { color: var(--ink4); }
    .b-row.b-tbd { color: var(--ink4); font-style: italic; font-weight: 400; }
    .b-row-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .b-row-score {
      font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 700;
      color: var(--amber); flex-shrink: 0;
    }
    .b-divider { height: 1px; background: var(--border); }
    .b-connector {
      width: 24px; height: 2px;
      background: var(--border);
      flex-shrink: 0;
    }
    .b-winner-badge {      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; font-size: 11px; font-weight: 700;
      color: var(--green); background: rgba(76,217,138,0.06);
      border-top: 1px solid rgba(76,217,138,0.1);
    }
    .b-sd-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 9px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase;
      color: #e05555;
      background: rgba(184,64,64,0.12);
      border: 1px solid rgba(184,64,64,0.3);
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* ── CHAMPION CARD ── */
    .champion-card {
      background: linear-gradient(135deg, rgba(196,135,58,0.12), rgba(196,135,58,0.04));
      border: 1px solid rgba(196,135,58,0.3);
      border-radius: 14px; padding: 2rem;
      text-align: center; margin-bottom: 2rem;
      position: relative; overflow: hidden;
    }
    .champion-card::before {
      content: '🏆'; font-size: 80px; opacity: 0.05;
      position: absolute; top: -10px; right: -10px;
    }
    .champion-label {
      font-size: 10px; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: var(--amber); margin-bottom: 8px;
    }
    .champion-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem; letter-spacing: 3px; color: #f0ece6;
    }

    /* ── GROUP TABS ── */
    .group-selector {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1rem 1.25rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .group-selector-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--ink4);
      font-family: 'DM Mono', monospace; flex-shrink: 0;
    }
    .group-tabs {
      display: flex; gap: 6px;
    }
    .group-tab {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 700; letter-spacing: 1px;
      border: 1px solid var(--border); background: none; color: var(--ink4);
      cursor: pointer; font-family: 'Segoe UI', system-ui, sans-serif;
      transition: all 0.2s; text-transform: uppercase;
    }
    .group-tab:hover { color: var(--ink); border-color: rgba(255,255,255,0.2); }
    .group-tab.on {
      background: rgba(196,135,58,0.12);
      border-color: rgba(196,135,58,0.4);
      color: var(--amber);
      box-shadow: 0 0 12px rgba(196,135,58,0.1);
    }
    .group-tab-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .pro-dot  { background: var(--amber); }
    .semi-dot { background: #63b3ed; }
    .group-tab.on .pro-dot  { box-shadow: 0 0 6px rgba(196,135,58,0.8); }
    .group-tab.on .semi-dot { box-shadow: 0 0 6px rgba(99,179,237,0.8); }

    /* ── FOOTER ── */
    .live-footer {
      text-align: center; padding: 3rem 1rem 2rem;
      font-size: 11px; color: var(--ink4);
      font-family: 'DM Mono', monospace;
      border-top: 1px solid var(--border);
      position: relative; z-index: 1;
    }
    .live-footer a { color: var(--amber); text-decoration: none; }

    /* ── ANIMATIONS ── */
    .fade-in { animation: fadeIn 0.4s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      /* Nav */
      nav { height: 64px; padding: 0 1rem; }
      .logo-img { height: 40px; }
      .wrap { padding: 5rem 1rem 4rem; }

      /* Tournament info card — stack vertical */
      .t-info-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 1rem;
      }
      .t-info-logo { width: 44px; height: 44px; font-size: 1.2rem; }
      .t-info-name { font-size: 1.3rem; letter-spacing: 1px; }
      .t-info-meta { font-size: 11px; }
      .t-info-pills { margin-left: 0; }

      /* Tabs — full width */
      .tabs { width: 100%; }
      .tab-btn { flex: 1; padding: 8px 10px; font-size: 11px; }

      /* Group selector — stack */
      .group-selector {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
      }
      .group-tabs { width: 100%; }
      .group-tab { flex: 1; justify-content: center; padding: 9px 12px; }

// i18n helper — t_(key, fallback) usable immediately in JS templates
window._T_LIVE = {};
window.t_ = (key, fallback) => window._T_LIVE[key] || window._T?.[key] || fallback;

async function initI18n() {
  const urlLang = new URLSearchParams(window.location.search).get('lang');
  const lang = urlLang || ((navigator.language || 'es').startsWith('es') ? 'es' : 'en');
  document.documentElement.lang = lang;
  window._lang = lang;
  if (lang === 'es') return;
  try {
    const T = await fetch('locales/en.json').then(r => r.json());
    window._T = T;
    const apply = (root) => {
      root.querySelectorAll('[data-i18n]:not([data-i18n-done])').forEach(el => {
        const v = T[el.dataset.i18n];
        if (v !== undefined) { el.textContent = v; el.dataset.i18nDone = '1'; }
      });
      root.querySelectorAll('[data-i18n-html]:not([data-i18n-done])').forEach(el => {
        const v = T[el.dataset.i18nHtml];
        if (v !== undefined) { el.innerHTML = v; el.dataset.i18nDone = '1'; }
      });
    };
    apply(document);
    if (T.page_title_live) document.title = T.page_title_live;
    new MutationObserver(() => apply(document.body))
      .observe(document.body, { childList: true, subtree: true });
  } catch(e) { console.warn('[i18n]', e.message); }
}
document.addEventListener('DOMContentLoaded', initI18n);
</script>

<script>
// ═══════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════
const SUPA_URL  = 'https://ofdxzysrjswalekwjazl.supabase.co';
const SUPA_KEY  = 'sb_publishable_ec6m8rEqcPSZyMvf7SMYag_-8GMIAc3';
const QUAL_KS_VAL = 8;

const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let ALL_ORGS    = [];  // organizers with active tournaments
let CUR_ORG     = null;
let CUR_STATE   = null; // ADMIN object from state_json
let CUR_TAB     = 'qualify'; // qualify | bracket
let CUR_GROUP   = 'pro';     // pro | semi
let _rtChannel  = null;
let _pollTimer  = null;

// ═══════════════════════════════════════════
//  API HELPERS
// ═══════════════════════════════════════════
async function get(path) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
  });
  if (!res.ok) {
    const err = await res.text();
    console.error('[live] API error', res.status, path, err);
    return [];
  }
  return res.json();
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
async function init() {
  // 1. Buscar activos Y pending — si no hay ninguno, no cargamos más
  let active;
  try {
    active = await get(`tournaments?status=in.(active,pending)&select=id,name,date,updated_at,state_json,user_id,status`);
  } catch(e) {
    console.error('[live] error:', e);
    renderEmpty(); return;
  }

  const hayActivos = (active || []).filter(r => r.state_json || r.status === 'pending').length > 0;

  // Sin activos ni pending → pantalla de espera
  if (!hayActivos) {
    if (!ALL_ORGS.length) {
      document.getElementById('main-wrap').innerHTML = `
        <div class="state-center fade-in">
          <div class="state-icon">⏳</div>
          <div class="state-title"><span data-i18n="live_no_active_title">Sin torneos en curso</span></div>
          <div class="state-sub"><span data-i18n="live_no_active_sub">No hay ningún torneo activo ahora mismo.</span><br><span data-i18n="live_no_active_sub2">Vuelve cuando haya uno en curso.</span></div>
        </div>`;
    }
    // Usar setTimeout y guardarlo correctamente
    if (_pollTimer) clearTimeout(_pollTimer);
    _pollTimer = setTimeout(init, 30000);
    return;
  }

  // 2. Hay activos/pending → cargar también archivados para historial
  let archived, closed;
  try {
    [archived, closed] = await Promise.all([
      get(`tournaments?status=eq.archived&select=id,name,date,updated_at,state_json,user_id,status&order=updated_at.desc&limit=20`),
      get(`tournaments?status=eq.closed&select=id,name,date,updated_at,state_json,user_id,status&order=updated_at.desc&limit=20`)
    ]);
  } catch(e) {
    archived = []; closed = [];
  }

  const rows = [...(active || []), ...(archived || []), ...(closed || [])].filter(r => r.state_json || r.status === 'pending');

  // 3. Enriquecer con info del organizador
  const enriched = await Promise.all(rows.map(async t => {
    try {
      const orgs = await get(`organizers?id=eq.${t.user_id}&select=id,club_name,logo_url,username`);
      return { ...t, organizers: orgs?.[0] || null };
    } catch(e) { return { ...t, organizers: null }; }
  }));

  ALL_ORGS = enriched;
  stampTime();

  const activos     = enriched.filter(t => t.status === 'active');
  const pendientes  = enriched.filter(t => t.status === 'pending');
  const finalizados = enriched.filter(t => t.status === 'archived');
  const cerrados    = enriched.filter(t => t.status === 'closed');

  // Si solo hay 1 activo y nada más → entrar directo
  if (activos.length === 1 && pendientes.length === 0 && finalizados.length === 0 && cerrados.length === 0) {
    selectOrg(activos[0]);
  } else {
    renderOrgList(activos, finalizados, cerrados, pendientes);
  }

  // Polling cada 30s como fallback — solo con setInterval (no mezclar con setTimeout)
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(() => { if (!CUR_ORG) init(); }, 30000);
}

// ═══════════════════════════════════════════
//  ACCORDION LIST VIEW
// ═══════════════════════════════════════════
let OPEN_ID = null; // ID del torneo expandido actualmente

function renderOrgList(activos, finalizados, cerrados, pendientes) {
  if (!activos)     activos     = ALL_ORGS.filter(t => t.status === 'active');
  if (!finalizados) finalizados = ALL_ORGS.filter(t => t.status === 'archived');
  if (!cerrados)    cerrados    = ALL_ORGS.filter(t => t.status === 'closed');
  if (!pendientes)  pendientes  = ALL_ORGS.filter(t => t.status === 'pending');

  const wrap = document.getElementById('main-wrap');

  const buildBanner = (t, mode) => {
    const org = t.organizers;
    const logoHtml = org?.logo_url ? `<img src="${org.logo_url}" alt="">` : '🏟';
    const badge = mode === 'live'
      ? `<div class="org-live-badge"><span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse-dot 1.4s infinite"></span> Live</div>`
      : mode === 'pending'
        ? `<div class="org-live-badge" style="background:rgba(196,135,58,0.15);color:var(--amber);border-color:rgba(196,135,58,0.3)">${t_('live_badge_reg','📋 Inscripciones')}</div>`
        : mode === 'closed'
          ? `<div class="org-closed-badge">${t_('live_badge_closed','✕ Cerrado')}</div>`
          : `<div class="org-done-badge">${t_('live_badge_done','✓ Finalizado')}</div>`;
    const isLive = mode === 'live';
    let champ = '';
    try {
      const s = typeof t.state_json === 'string' ? JSON.parse(t.state_json) : t.state_json;
      const c = [s?.pro?.champion, s?.semi?.champion].filter(Boolean);
      if (c.length) champ = `<div class="t-banner-champ">🏆 ${c.join(' · ')}</div>`;
    } catch(e) {}
    return `
      <div class="t-banner" id="banner-${t.id}" onclick="toggleAccordion('${t.id}')">
        <div class="t-banner-logo">${logoHtml}</div>
        <div class="t-banner-info">
          <div class="t-banner-name">${t.name || org?.club_name || t_('live_tournament','Torneo')}</div>
          <div class="t-banner-meta">${org?.club_name || org?.username || ''}${t.date ? ' · ' + fmtDate(t.date) : ''}</div>
          ${champ}
        </div>
        <div class="t-banner-right">
          ${badge}
          <span class="t-banner-chevron">▼</span>
        </div>
      </div>
      <div class="t-panel" id="panel-${t.id}">
        <div class="t-panel-inner" id="panel-inner-${t.id}"></div>
      </div>`;
  };

  let html = `<div class="fade-in"><div class="tournament-list">`;

  const hasAnything = activos.length || pendientes.length || finalizados.length || cerrados.length;

  if (activos.length) {
    html += `<div class="list-section-label">${t_('live_label_live','En directo')}</div>`;
    html += activos.map(t => buildBanner(t, 'live')).join('');
  }
  if (pendientes.length) {
    html += `<div class="list-section-label" style="margin-top:${activos.length ? '1.5rem' : '0'}">${t_('live_label_upcoming','Próximamente')}</div>`;
    html += pendientes.map(t => buildBanner(t, 'pending')).join('');
  }
  if (finalizados.length) {
    html += `<div class="list-section-label" style="margin-top:${(activos.length || pendientes.length) ? '1.5rem' : '0'}">${t_('live_label_finished','Finalizados')}</div>`;
    html += finalizados.map(t => buildBanner(t, 'done')).join('');
  }
  if (cerrados.length) {
    html += `<div class="list-section-label" style="margin-top:${(activos.length || pendientes.length || finalizados.length) ? '1.5rem' : '0'};color:#e05555">${t_('live_label_closed','Cerrados')}</div>`;
    html += cerrados.map(t => buildBanner(t, 'closed')).join('');
  }
  if (!hasAnything) {
    html += `<div class="state-center"><div class="state-icon">🪓</div>
      <div class="state-title">${t_('live_no_tournaments_title','Sin torneos')}</div>
      <div class="state-sub">${t_('live_later','Vuelve más tarde.')}</div></div>`;
  }

  html += `</div></div>`;
  wrap.innerHTML = html;

  // Auto-abrir el primero activo si existe
  if (activos.length === 1) toggleAccordion(activos[0].id);
}

function toggleAccordion(tid) {
  const t = ALL_ORGS.find(x => x.id === tid);
  if (!t) return;

  const banner = document.getElementById('banner-' + tid);
  const panel  = document.getElementById('panel-' + tid);

  // Cerrar el anterior si es diferente
  if (OPEN_ID && OPEN_ID !== tid) {
    const prevBanner = document.getElementById('banner-' + OPEN_ID);
    const prevPanel  = document.getElementById('panel-' + OPEN_ID);
    if (prevBanner) prevBanner.classList.remove('open');
    if (prevPanel)  prevPanel.classList.remove('open');
    stopSync();
  }

  const isOpening = !banner.classList.contains('open');

  if (isOpening) {
    banner.classList.add('open');
    panel.classList.add('open');
    OPEN_ID = tid;
    // Cargar contenido del panel
    renderPanelContent(t);
    // Sync solo si activo
    if (t.status === 'active') startLiveSync(t.user_id, tid);
    // Scroll suave al banner
    setTimeout(() => banner.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  } else {
    banner.classList.remove('open');
    panel.classList.remove('open');
    OPEN_ID = null;
    stopSync();
  }
}

        <div>

  const champHtml = ((isFinished || isClosed) && (s?.pro?.champion || s?.semi?.champion)) ? `
    <div class="champion-card" style="margin-bottom:1.25rem">
      <div class="champion-label">🏆 ${[s?.pro?.champion && t_('live_champ_pro','Campeón PRO'), s?.semi?.champion && t_('live_champ_semi','Campeón SEMI PRO')].filter(Boolean).join(' · ')}</div>

  const groupTabsHtml = showGroupTabs ? `

          <span class="group-tab-dot pro-dot"></span> PRO
        </button>
        <button class="group-tab ${CUR_GROUP==='semi' ? 'on':''}" data-group="semi" onclick="switchGroup('semi')">
          <span class="group-tab-dot semi-dot"></span> SEMI PRO
        </button>
      </div>
    </div>` : '';

  wrap.innerHTML = `
    <div class="fade-in">
      <!-- Back -->
      ${ALL_ORGS.length > 1 ? `<button class="back-btn" onclick="backToList()" style="float:right;margin-bottom:1rem">← Todos los torneos</button><div style="clear:both"></div>` : ''}

      <!-- Tournament info -->
      <div class="t-info-card">
        <div class="t-info-logo">${logoHtml}</div>
        <div>
          <div class="t-info-name">${s?.tName || t_('live_tournament','Torneo')}</div>
          <div class="t-info-meta">${org?.club_name || org?.username || ''}${s?.tDate ? ' · ' + fmtDate(s.tDate) : ''}</div>
        </div>
        <div class="t-info-pills">${phasePill}${groupPills}</div>
      </div>

      ${isFinished && (s?.pro?.champion || s?.semi?.champion) ? `
      <div class="champion-card" style="margin-bottom:1.75rem">
        <div class="champion-label">🏆 ${[s?.pro?.champion && t_('live_champ_pro','Campeón PRO'), s?.semi?.champion && t_('live_champ_semi','Campeón SEMI PRO')].filter(Boolean).join(' · ')}</div>
        <div class="champion-name">${[s?.pro?.champion, s?.semi?.champion].filter(Boolean).join(' &amp; ')}</div>
      </div>` : ''}

      ${tabs}
      ${groupTabsHtml}

      <div id="tab-content"></div>
    </div>`;

  renderTabContent();
}

function renderTabContent() {
  const el = document.getElementById('tab-content');
  if (!el) return;
  if (CUR_TAB === 'qualify') {
    el.innerHTML = renderQualifyView();
  } else {
    el.innerHTML = renderBracketView();
  }
}

// ═══════════════════════════════════════════
//  QUALIFY VIEW
// ═══════════════════════════════════════════
function renderQualifyView() {
  const g = G();
  const activePlayers = (g.players || []).filter(p => !p.disqualified);

  if (!activePlayers.length) {
    return `<div class="state-center" style="padding:4rem"><div class="state-icon">📊</div>
      <div class="state-sub">${t_('live_no_players','Sin jugadores en clasificación todavía')}</div></div>`;
  }

  // Compute totals and sort
  const ranked = activePlayers.map(pl => {
    let total = 0, ks = 0;
    for (let r = 0; r < (g.qualCfg?.rounds || 2); r++) {
      const throws = (g.qualScores?.[pl.id] || {})['r' + r] || [];
      throws.forEach(v => { if (v !== null) { total += v; if (v === QUAL_KS_VAL) ks++; } });
    }
    return { ...pl, total, ks };
  }).sort((a, b) => b.total - a.total);

  const rows = ranked.map((pl, i) => {
    const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
    const rounds = g.qualCfg?.rounds || 2;
    const throwsPerRound = g.qualCfg?.throws || 10;

    // Build throws mini — todas las rondas con datos
    let throwsMini = '';
    for (let r = 0; r < rounds; r++) {
      const sc = (g.qualScores?.[pl.id] || {})['r' + r] || [];
      if (!sc.some(v => v !== null)) continue; // saltar ronda sin datos
      const rTotal = sc.reduce((s, v) => s + (v || 0), 0);
      const cells = Array.from({ length: throwsPerRound }, (_, t) => {
        const v = sc[t] ?? null;
        if (v === null) return `<div class="t-cell"></div>`;
        if (v === QUAL_KS_VAL) return `<div class="t-cell is-ks">KS</div>`;
        if (v === 0) return `<div class="t-cell is-zero">0</div>`;
        return `<div class="t-cell scored">${v}</div>`;
      }).join('');
      throwsMini += `
        <div style="display:flex;flex-direction:column;gap:3px;${r < rounds-1 ? 'margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,0.05)' : ''}">
          <div style="font-size:9px;color:var(--ink4);font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:2px">R${r+1} · ${rTotal}pts</div>
          <div class="throws-mini">${cells}</div>
        </div>`;
    }

    return `<tr>
      <td><span class="rank-num ${rankClass}">${medal || '#' + (i+1)}</span></td>
      <td><div class="player-name">${pl.name}</div></td>
      <td class="center"><div class="score-pts">${pl.total}</div>${pl.ks ? `<div class="score-ks">${pl.ks} KS</div>` : ''}</td>
      <td><div style="min-width:200px">${throwsMini}</div></td>
    </tr>`;
  }).join('');

  const dqRows = (g.players || []).filter(p => p.disqualified).map(pl =>
    `<tr><td colspan="4"><span class="rank-num">DQ</span> <span class="player-name dq">${pl.name}</span></td></tr>`
  ).join('');

  return `
    <div class="qual-table-wrap">
      <table class="qual-table">
        <thead>
          <tr>
            <th style="width:50px">#</th>
            <th>Jugador</th>
            <th class="center">Puntos</th>
            <th>Lanzamientos por ronda</th>
          </tr>
        </thead>
        <tbody>${rows}${dqRows}</tbody>
      </table>
    </div>`;
}

// ═══════════════════════════════════════════
//  BRACKET VIEW
// ═══════════════════════════════════════════
function renderBracketView() {
  const g = G();

  if (!g.rounds?.length) {
    return `<div class="state-center" style="padding:4rem">
      <div class="state-icon">🏆</div>
      <div class="state-sub"><span data-i18n="live_bracket_pending">El bracket aún no ha sido generado</span></div>
    </div>`;
  }

  // Champion
  let champHtml = '';
  if (g.champion) {
    champHtml = `
      <div class="champion-card">
        <div class="champion-label">🏆 Campeón</div>
        <div class="champion-name">${g.champion}</div>
      </div>`;
  }

  // Build bracket
  let bracketHtml = `<div class="bracket-scroll"><div class="bracket-wrap">`;
  g.rounds.forEach((round, ri) => {
    bracketHtml += `<div class="b-round">
      <div class="b-round-hdr">${rndName(ri, g.rounds.length)}</div>
      <div class="b-matches">`;

    round.forEach(mid => {
      const m = (g.matches || []).find(x => x.id === mid);
      if (!m) return;
      const isFin = ri === g.rounds.length - 1;
      const p1W = m.winner && m.winner === m.p1;
      const p2W = m.winner && m.winner === m.p2;

      const c1 = p1W ? 'b-winner' : (p2W ? 'b-loser' : (!m.p1 ? 'b-tbd' : ''));
      const c2 = p2W ? 'b-winner' : (p1W ? 'b-loser' : (!m.p2 ? 'b-tbd' : ''));

      bracketHtml += `<div class="b-match${isFin ? ' final' : ''}">
        <div class="b-row ${c1}">
          <span class="b-row-name">${m.p1 || t_('live_tbd','Por definir')}</span>
          ${m.score1 !== null && m.score1 !== undefined ? `<span class="b-row-score">${m.score1}</span>` : ''}
        </div>
        <div class="b-divider"></div>
        <div class="b-row ${c2}">
          <span class="b-row-name">${m.p2 || t_('live_tbd','Por definir')}</span>
          ${m.score2 !== null && m.score2 !== undefined ? `<span class="b-row-score">${m.score2}</span>` : ''}
        </div>
        ${m.winner
          ? `<div class="b-winner-badge">✓ ${m.winner}${(m.sdRounds?.length) ? `<span class="b-sd-badge">💀 MS×${m.sdRounds.length}</span>` : ''}</div>`
          : (m.bye ? `<div class="b-winner-badge" style="color:var(--ink4)">BYE</div>` : '')
        }
      </div>`;
    });

    bracketHtml += `</div></div>`;

    // Connector between rounds
    if (ri < g.rounds.length - 1) {
      bracketHtml += `<div style="display:flex;align-items:center;padding-top:3rem"><div class="b-connector"></div></div>`;
    }
  });
  bracketHtml += `</div></div>`;

  return champHtml + bracketHtml;
}

// ═══════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════
function switchTab(tab) {
  CUR_TAB = tab;
  // Update tab buttons
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('on', b.textContent.toLowerCase().includes(tab === 'qualify' ? 'clas' : 'brack'));
  });
  renderTabContent();
}

function switchGroup(g) {
  CUR_GROUP = g;
  document.querySelectorAll('.group-tab').forEach(b => {
    b.classList.toggle('on', b.dataset.group === g);
  });
  renderTabContent();
}

function backToList() {
  stopSync();
  CUR_ORG = null; CUR_STATE = null;
  OPEN_ID = null;
  renderOrgList();
}

// ═══════════════════════════════════════════
//  LIVE SYNC (realtime + polling)
// ═══════════════════════════════════════════
function startLiveSync(userId, tid) {
  stopSync();

  let _rendering = false; // guard contra renders simultáneos

  const applyUpdate = (state, newStatus) => {
    if (!state || _rendering) return;
    _rendering = true;
    CUR_STATE = state;
    if (CUR_ORG) CUR_ORG = { ...CUR_ORG, state_json: state, status: newStatus || CUR_ORG.status };
    const idx = ALL_ORGS.findIndex(x => x.id === tid);
    if (idx >= 0) ALL_ORGS[idx] = { ...ALL_ORGS[idx], state_json: state, status: newStatus || ALL_ORGS[idx].status };
    if (newStatus === 'archived') stopSync();
    stampTime();
    // Re-render solo si el torneo está visible
    if (OPEN_ID === tid) {
      const t = ALL_ORGS.find(x => x.id === tid);
      if (t) renderPanelContent(t);
    } else if (document.getElementById('tab-content')) {
      renderTabContent(); // solo re-render el contenido, no todo el torneo
    }
    setTimeout(() => { _rendering = false; }, 500); // liberar tras 500ms
  };

  // Realtime
  _rtChannel = sb.channel('live-' + userId)
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public', table: 'tournaments',
      filter: `user_id=eq.${userId}`
    }, payload => {
      const row = payload.new;
      if (!row?.state_json) return;
      const state = typeof row.state_json === 'string' ? JSON.parse(row.state_json) : row.state_json;
      applyUpdate(state, row.status);
    })
    .subscribe();

  // Polling every 20s as fallback
  _pollTimer = setInterval(async () => {
    try {
      const rows = await get(`tournaments?user_id=eq.${userId}&status=eq.active&select=state_json,updated_at,status&order=updated_at.desc&limit=1`);
      if (!rows?.[0]?.state_json) return;
      const state = typeof rows[0].state_json === 'string' ? JSON.parse(rows[0].state_json) : rows[0].state_json;
      if (JSON.stringify(state) === JSON.stringify(CUR_STATE)) return;
      applyUpdate(state, rows[0].status);
    } catch(e) {}
  }, 30000);
}

function stopSync() {
  if (_rtChannel) { sb.removeChannel(_rtChannel); _rtChannel = null; }
  if (_pollTimer) { clearInterval(_pollTimer); clearTimeout(_pollTimer); _pollTimer = null; }
}

// ═══════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════
function rndName(ri, total) {
  const r = total - ri;
  if (r === 1) return t_('live_round_final','FINAL');
  if (r === 2) return t_('live_round_semi','SEMIFINAL');
  if (r === 3) return t_('live_round_quarters','CUARTOS');
  return 'RONDA ' + (ri + 1);
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
}

function stampTime() {
  const el = document.getElementById('last-updated');
  if (el) el.textContent = t_('live_updated','Actualizado') + ' ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ═══════════════════════════════════════════
//  START
// ═══════════════════════════════════════════
// Sticky nav
const navEl = document.getElementById('nav');
window.addEventListener('scroll', () => {
  navEl.classList.toggle('scrolled', window.scrollY > 60);
});
// Mobile menu
function toggleMenu() {
  document.getElementById('mobile-menu').classList.toggle('open');
}

init();
</script>
